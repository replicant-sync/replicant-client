[package]
name = "replicant-client"
version = "0.7.0"
edition = "2021"

[dependencies]
tokio = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-util = { version = "0.7", features = ["time"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json", "uuid", "chrono", "tls-rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
json-patch = "1.2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2.5"
chacha20poly1305 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
wiremock = "0.6"
serial_test = "3.0"

[build-dependencies]
# Exact pin: the tracked replicant-client/include/replicant.h must be regenerated
# with this exact cbindgen version to avoid banner/whitespace churn on commit.
cbindgen = "=0.26.0"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
