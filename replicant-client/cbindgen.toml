# cbindgen configuration for replicant-client

language = "C"
header = "/* Replicant - Offline-first Document Sync C API */"
include_guard = "REPLICANT_H"
pragma_once = true
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
include_version = true
namespace = "replicant"
cpp_compat = true
usize_is_size_t = true
documentation = true

[export]
include = [
    "Replicant",
    "ReplicantConfig",
    "ReplicantListMerge",
    "ReplicantState",
    "ReplicantConnection",
    "ReplicantSync",
    "ReplicantHaltReason",
    "SyncResult",
    "EventType",
    "EventOrigin",
    "ReplicantErrorCode",
    "ReplicantDocumentEventCallback",
    "ReplicantSyncEventCallback",
    "ReplicantErrorEventCallback",
    "ReplicantConnectionEventCallback",
    "ReplicantConflictEventCallback",
]

# Prefix types to avoid polluting global namespace in C++
[export.rename]
"EventType" = "ReplicantEventType"
"EventOrigin" = "ReplicantEventOrigin"
"SyncResult" = "ReplicantSyncResult"

[fn]
rename_args = "snake_case"

